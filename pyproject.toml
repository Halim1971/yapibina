[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "yapibina"
version = "0.1.0"
description = "Sade, güvenilir ve white-label bina yönetim sistemi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-Limiter>=3.8,<5.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "email-validator>=2.1,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-flask>=1.3,<2.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["app", "config", "tests", "wsgi.py"]
strict = true
warn_unused_configs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["flask_login.*", "flask_migrate.*", "flask_wtf.*", "wtforms.*"]
ignore_missing_imports = true
